events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    # 开启 gzip
    gzip on;
    gzip_types text/plain application/xml text/css application/javascript application/json;

    upstream auth_service {
        server auth-service:8081;
    }

    upstream edu_service {
        server edu-service:8082;
    }

    upstream llm_service {
        server llm-service:8000;
    }

    upstream security_service {
        server security-service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # 允许跨域
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Auth Service 路由
        location /api/v1/auth {
            proxy_pass http://auth_service/api/v1/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/bindings {
            proxy_pass http://auth_service/api/v1/bindings;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Auth Service Swagger UI
        location /swagger/ {
            proxy_pass http://auth_service/swagger/;
            proxy_set_header Host $host;
        }

        # Edu Service 路由
        location /api/v1/edu {
            proxy_pass http://edu_service/api/v1/edu;
            proxy_set_header Host $host;
        }
        
        location /api/v1/classes {
            proxy_pass http://edu_service/api/v1/classes;
            proxy_set_header Host $host;
        }

        location /api/v1/persons {
            proxy_pass http://edu_service/api/v1/persons;
            proxy_set_header Host $host;
        }

        location /api/v1/teachers {
            proxy_pass http://edu_service/api/v1/teachers;
            proxy_set_header Host $host;
        }

        location /api/v1/schedules {
            proxy_pass http://edu_service/api/v1/schedules;
            proxy_set_header Host $host;
        }

        # 仪表盘路由 (迁移至 Edu Service)
        location /api/v1/dashboard {
            proxy_pass http://edu_service/api/v1/dashboard;
            proxy_set_header Host $host;
        }

        # Security Service 路由
        location /api/v1/security {
            proxy_pass http://security_service/api/v1/security;
            proxy_set_header Host $host;
        }

        # Edu Service Swagger UI (Legacy)
        # location /swagger-ui/ ... (moved up)

        # 3. Security Service 文档
        # 处理缺少斜杠的情况
        location = /docs/security {
            return 301 /docs/security/;
        }
        
        # 主文档页面
        location /docs/security/ {
            proxy_pass http://security_service/docs;
            proxy_set_header Host $host;
            # 告诉 FastAPI 它被挂载在 /docs/security 下，这样它生成的 openapi.json URL 就会带上这个前缀
            proxy_set_header X-Forwarded-Prefix /docs/security;
        }

        # 针对 Security Service 的 schema 代理 (精确匹配)
        location = /docs/security/openapi.json {
            proxy_pass http://security_service/openapi.json;
            proxy_set_header Host $host;
        }

        # 4. LLM Service 文档
        location = /docs/llm {
            return 301 /docs/llm/;
        }
        
        location /docs/llm/ {
            proxy_pass http://llm_service/docs;
            proxy_set_header Host $host;
        }

        # 5. Auth Service 文档
        location = /docs/auth { return 301 /docs/auth/; }
        # 根文档页面 -> /swagger/index.html
        location = /docs/auth/ {
            proxy_pass http://auth_service/swagger/index.html;
            proxy_set_header Host $host;
        }
        # 静态资源与子路径 -> /swagger/*
        location /docs/auth/ {
            proxy_pass http://auth_service/swagger/;
            proxy_set_header Host $host;
        }

        # 6. Edu Service 文档
        location = /docs/edu { return 301 /docs/edu/; }
        # 根文档页面 -> /swagger-ui/index.html
        location = /docs/edu/ {
            proxy_pass http://edu_service/swagger-ui/index.html;
            proxy_set_header Host $host;
        }
        # 静态资源与子路径 -> /swagger-ui/*
        location /docs/edu/ {
            proxy_pass http://edu_service/swagger-ui/;
            proxy_set_header Host $host;
        }
        # Edu Service 需要的 API Docs 路径 (保持原样，供 swagger-ui 调用)
        location /v3/api-docs {
            proxy_pass http://edu_service/v3/api-docs;
            proxy_set_header Host $host;
        }
        # Edu Service 原 swagger-ui 路径 (可选保留)
        location /swagger-ui/ {
             proxy_pass http://edu_service/swagger-ui/;
             proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://security_service/openapi.json;
            proxy_set_header Host $host;
        }

        # LLM Service 路由 (默认/兜底)
        # 包括 /docs, /openapi.json, /api/v1/chat, /api/v1/admin 等
        location / {
            proxy_pass http://llm_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
