version: '3.8'

services:
  # 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: llm-filter-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: llm_filter_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - llm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d llm_filter_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 身份认证服务 (Go)
  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: llm-filter-auth
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=llm_filter_db
      - DB_PORT=5432
      - JWT_SECRET=llm_filter_secure_secret_key_2025_update_must_be_32_bytes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - llm-network

  # 教务核心服务 (Java)
  edu-service:
    build:
      context: ./microservices/edu-service
      dockerfile: Dockerfile
    container_name: llm-filter-edu
    restart: always
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=llm_filter_db
      - DB_PORT=5432
      - JWT_SECRET=llm_filter_secure_secret_key_2025_update_must_be_32_bytes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - llm-network

  # LLM 服务 (Python)
  llm-service:
    build:
      context: ./microservices/llm-service
      dockerfile: Dockerfile
    container_name: llm-filter-llm
    restart: always
    # 生产环境不需要 --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    ports:
      - "8000:8000"
    # 生产环境移除代码挂载，使用镜像内的代码
    volumes:
      - ./scripts:/app/scripts
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - DB_NAME=llm_filter_db
      - SECRET_KEY=llm_filter_secure_secret_key_2025_update_must_be_32_bytes
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - TERM_START_DATE=2025-09-01
      - OLLAMA_BASE_URL=http://192.168.6.6:11434/
      - OLLAMA_MODEL=deepseek-r1:14b
      # Dify Configuration
      - DIFY_API_URL=http://192.168.6.6/v1
      - DIFY_API_KEY=app-lkK33EQOVXXrjD9x3SKbItr7
    depends_on:
      - mongo
    networks:
      - llm-network

  # 安全分析服务 (Python)
  security-service:
    build:
      context: ./microservices/security-service
      dockerfile: Dockerfile
    container_name: llm-filter-security
    restart: always
    # 生产环境不需要 --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    ports:
      - "8003:8000"
    # 生产环境移除代码挂载
    environment:
      - JWT_SECRET=llm_filter_secure_secret_key_2025_update_must_be_32_bytes
      - DIFY_API_URL=http://192.168.6.6/v1
      - DIFY_API_KEY=app-ggTb0oC9WXQQm2r7KrvVUS6v
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB_NAME=security_service_db
    networks:
      - llm-network

  # MongoDB 服务
  mongo:
    image: mongo:latest
    container_name: llm-filter-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - llm-network

  # API 网关 (Nginx)
  gateway:
    image: nginx:alpine
    container_name: llm-filter-gateway
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - edu-service
      - llm-service
      - security-service
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
