version: '3.8'

services:
  # 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: llm-filter-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${POSTGRES_PORT_EXTERNAL:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - llm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 身份认证服务 (Go)
  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: llm-filter-auth
    restart: always
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - TZ=${TZ}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - llm-network

  # 教务核心服务 (Java)
  edu-service:
    build:
      context: ./microservices/edu-service
      dockerfile: Dockerfile
    container_name: llm-filter-edu
    restart: always
    ports:
      - "${EDU_SERVICE_PORT:-8082}:8082"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=${SERVER_PORT}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO}
      - JPA_SHOW_SQL=${JPA_SHOW_SQL}
      - JPA_FORMAT_SQL=${JPA_FORMAT_SQL}
      - JPA_DIALECT=${JPA_DIALECT}
      - LOGGING_LEVEL=${LOGGING_LEVEL}
      - SPRING_REDIS_HOST=${REDIS_HOST}
      - SPRING_REDIS_PORT=${REDIS_PORT}
      - TZ=${TZ}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - llm-network

  # LLM 服务 (Python)
  llm-service:
    build:
      context: ./microservices/llm-service
      dockerfile: Dockerfile
    container_name: llm-filter-llm
    restart: always
    # 生产环境：移除--reload，使用多worker提高性能
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips '*'
    ports:
      - "${LLM_SERVICE_PORT:-8000}:8000"
    # 生产环境移除代码挂载，使用镜像内的代码
    volumes:
      - ./scripts:/app/scripts
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${JWT_SECRET}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - TERM_START_DATE=${TERM_START_DATE}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      # Dify Configuration
      - DIFY_API_URL=${DIFY_API_URL}
      - DIFY_API_KEY=${DIFY_API_KEY}
      - DIFY_RESPONSE_MODE=${DIFY_RESPONSE_MODE}
      - DIFY_MESSAGE_ENDPOINT=${DIFY_MESSAGE_ENDPOINT}
      # Redis Configuration
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # App Configuration
      - APP_BASE_URL=${APP_BASE_URL}
      - API_V1_STR=${API_V1_STR}
      - APP_MODE=${APP_MODE}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - TZ=${TZ}
    depends_on:
      - mongo
    networks:
      - llm-network

  # 安全分析服务 (Python)
  security-service:
    build:
      context: ./microservices/security-service
      dockerfile: Dockerfile
    container_name: llm-filter-security
    restart: always
    # 生产环境：移除--reload，使用多worker提高性能
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips '*'
    ports:
      - "${SECURITY_SERVICE_PORT:-8003}:8000"
    # 生产环境移除代码挂载
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ALGORITHM=${ALGORITHM}
      - DIFY_API_URL=${DIFY_API_URL}
      - DIFY_API_KEY=${DIFY_API_KEY}
      - DIFY_RESPONSE_MODE=${DIFY_RESPONSE_MODE}
      - MONGODB_URL=${MONGODB_URL}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ZABBIX_URL=${ZABBIX_URL:-http://localhost}
      - ZABBIX_USERNAME=${ZABBIX_USERNAME:-Admin}
      - ZABBIX_PASSWORD=${ZABBIX_PASSWORD:-zabbix}
      - ZABBIX_SYNC_INTERVAL=${ZABBIX_SYNC_INTERVAL:-3600}
      - ZABBIX_AUTO_SYNC=${ZABBIX_AUTO_SYNC:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - TZ=${TZ}
    networks:
      - llm-network

  # MongoDB 服务
  mongo:
    image: mongo:latest
    container_name: llm-filter-mongo
    restart: always
    ports:
      - "${MONGODB_PORT_EXTERNAL:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - llm-network

  # API 网关 (Nginx)
  gateway:
    image: nginx:alpine
    container_name: llm-filter-gateway
    restart: always
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - TZ=${TZ}
    depends_on:
      - auth-service
      - edu-service
      - llm-service
      - security-service
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
