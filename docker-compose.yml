version: '3.8'

services:
  # 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: llm-filter-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: llm_filter_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - llm-network

  # 身份认证服务 (Go)
  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: llm-filter-auth
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=llm_filter_db
      - DB_PORT=5432
      - JWT_SECRET=llm_filter_secure_secret_key_2025_update_must_be_32_bytes
    depends_on:
      - postgres
    networks:
      - llm-network

  # 教务核心服务 (Go)
  edu-service:
    build:
      context: ./microservices/edu-service
      dockerfile: Dockerfile
    container_name: llm-filter-edu
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=llm_filter_db
      - DB_PORT=5432
      - JWT_SECRET=llm_filter_secure_secret_key_2025_update_must_be_32_bytes
    depends_on:
      - postgres
    networks:
      - llm-network

  # LLM 服务 (Python)
  llm-service:
    build:
      context: ./microservices/llm-service
      dockerfile: Dockerfile
    container_name: llm-filter-llm
    ports:
      - "8000:8000"
    volumes:
      - ./microservices/llm-service:/app
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - DB_NAME=llm_filter_db
      - SECRET_KEY=llm_filter_secure_secret_key_2025_update_must_be_32_bytes
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - TERM_START_DATE=2025-09-01
      - OLLAMA_BASE_URL=http://datacenter.dldzxx.cn:11434/
      - OLLAMA_MODEL=deepseek-r1:14b
    depends_on:
      - mongo
    networks:
      - llm-network

  # MongoDB 服务 (LLM 服务依赖)
  mongo:
    image: mongo:latest
    container_name: llm-filter-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - llm-network

  # API 网关 (Nginx)
  gateway:
    image: nginx:alpine
    container_name: llm-filter-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - edu-service
      - llm-service
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
